name: Stage BARI binary assets
on:
  push:
    branches: [feature/orka-bari-public-demo]
    paths: ['.github/workflows/stage-bari-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    if: github.ref == 'refs/heads/feature/orka-bari-public-demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy and verify source binary files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalogue/orka/bari
          base="https://raw.githubusercontent.com/mhd-yasser/VREEL-E-Catalogue-Preview/main/catalogue/orka/bari"
          curl --fail --location --retry 3 --output catalogue/orka/bari/model.glb "$base/model.glb"
          curl --fail --location --retry 3 --output catalogue/orka/bari/photo.png "$base/photo.png"
          curl --fail --location --retry 3 --output catalogue/orka/bari/source.zip "$base/source.zip"
          printf '%s\n' \
            'be2bd6daa6177e5bd612ca9aac241155638ec28341fecb9e62cf164fc51071c8  catalogue/orka/bari/model.glb' \
            'd1dc49113992dc7047a36849ea9eecb513b74641843fc8690907c65542d90d17  catalogue/orka/bari/photo.png' \
            'aefcb5a051624c1b96444080e964b7d14b0278a7df24854d60d0dcb54b0064f5  catalogue/orka/bari/source.zip' | sha256sum --check
      - name: Commit binary resources on staging branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue/orka/bari/model.glb catalogue/orka/bari/photo.png catalogue/orka/bari/source.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Stage verified BARI binary resources from Preview'
            git push origin HEAD:feature/orka-bari-public-demo
          fi
