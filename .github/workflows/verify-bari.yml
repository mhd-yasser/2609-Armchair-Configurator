name: Verify BARI public demo staging
on:
  push:
    branches: [feature/orka-bari-public-demo]
    paths: ['.github/workflows/verify-bari.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check asset fingerprints and public file structure
        run: |
          set -euo pipefail
          sha256sum --check <<'EOF'
          be2bd6daa6177e5bd612ca9aac241155638ec28341fecb9e62cf164fc51071c8  catalogue/orka/bari/model.glb
          d1dc49113992dc7047a36849ea9eecb513b74641843fc8690907c65542d90d17  catalogue/orka/bari/photo.png
          aefcb5a051624c1b96444080e964b7d14b0278a7df24854d60d0dcb54b0064f5  catalogue/orka/bari/source.zip
          EOF
          test ! -e admin/index.html
          test ! -e manage/index.html
          grep -q 'orka-bari' products/index.html
          node --check viewer-app.js
          node --check authored-viewer.js
      - name: Install Playwright Chromium
        run: |
          npm install --prefix /tmp/vreel-test --no-audit --no-fund playwright
          /tmp/vreel-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve and test BARI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vreel-http.log 2>&1 &
          cat > /tmp/vreel-test/check.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--no-sandbox']});
           const page=await browser.newPage({viewport:{width:1400,height:900},acceptDownloads:true});
           const problems=[];
           page.on('pageerror',e=>problems.push('pageerror: '+e.message));
           page.on('response',r=>{if(r.status()>=400 && new URL(r.url()).host==='127.0.0.1:8765')problems.push('HTTP '+r.status()+' '+r.url())});
           page.on('console',m=>{if(m.type()==='error')problems.push('console: '+m.text())});
           await page.goto('http://127.0.0.1:8765/products/',{waitUntil:'domcontentloaded'});
           if(await page.locator('a[href="../product/?catalogue=orka-bari"]').count()<1)throw Error('BARI catalogue link missing');
           await page.goto('http://127.0.0.1:8765/product/?catalogue=orka-bari',{waitUntil:'domcontentloaded'});
           await page.waitForTimeout(2500);
           await page.locator('#model-loading[hidden]').waitFor({state:'attached',timeout:90000}).catch(()=>{});
           await page.waitForFunction(()=>document.querySelector('#model-loading')?.hidden === true, {timeout:90000}).catch(()=>{});
           const loaded=await page.locator('#model-loading').evaluate(el=>el.hidden);
           if(!loaded) throw Error('BARI 3D model did not finish loading: '+await page.locator('#notice').textContent());
           if(!((await page.title()).includes('BARI')))throw Error('Product title not BARI');
           await page.locator('#source-download').click();
           if(!await page.locator('#source-modal').isVisible())throw Error('Download contact modal missing');
           await page.locator('#source-form [name=person]').fill('Test Visitor');
           await page.locator('#source-form [name=company]').fill('VREEL QA');
           await page.locator('#source-form [name=email]').fill('qa@example.com');
           await page.locator('#source-form [name=phone]').fill('123456789');
           await page.locator('#source-form button[type=submit]').click();
           const buttons=await page.locator('#source-downloads button').allTextContents();
           if(buttons.length!==1||!buttons[0].includes('3ds'))throw Error('Expected only archived 3ds download, got '+JSON.stringify(buttons));
           const dl=page.waitForEvent('download',{timeout:20000});
           await page.locator('#source-downloads button').click();
           const downloaded=await dl;console.log('BARI source download:',downloaded.suggestedFilename());
           if(!downloaded.suggestedFilename().endsWith('.zip'))throw Error('Expected zip');
           await page.locator('[data-close-source]').click();
           await page.locator('#datasheet').dispatchEvent('click',{},{timeout:120000});
           await page.locator('#pdf-modal').waitFor({state:'visible',timeout:120000});
           if(!await page.locator('#pdf-modal').isVisible())throw Error('PDF preview modal missing');
           console.log('Loaded BARI, download form and PDF preview tested');
           await page.locator('#pdf-modal .modal-close').click({timeout:20000});
           for (const product of ['desk','chair','sofa']) {
             await page.goto('http://127.0.0.1:8765/'+product+'/',{waitUntil:'domcontentloaded'});
             await page.waitForFunction(()=>document.querySelector('#model-loading')?.hidden===true, {timeout:75000}).catch(()=>{});
             console.log('Legacy viewer',product,'title',await page.title());
             if(!await page.locator('#product-viewer').count())throw Error(product+' viewer missing');
           }
           console.log('Legacy desk, chair and sofa opened');
           if(problems.length)throw Error('Browser issues: '+problems.join(' | '));
           await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/vreel-test/check.cjs
